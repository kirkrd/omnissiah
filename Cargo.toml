[package]
name = "omnissiah"
version = "0.1.0"
edition = "2024"
description = "Tech Priest CLI orchestrator for Claude Code and Cursor Agent"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
dirs = "7.0.0"
rand = "0.10.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
